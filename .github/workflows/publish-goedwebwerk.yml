name: Publish GOED WEBWERK v8

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-goedwebwerk.yml"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror approved v8 preview
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf _mirror
          mkdir -p _mirror
          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --execute robots=off \
            --no-parent \
            --domains=goedwebwerk-preview.emsitao.workers.dev \
            --directory-prefix=_mirror \
            https://goedwebwerk-preview.emsitao.workers.dev/
          src="_mirror/goedwebwerk-preview.emsitao.workers.dev"
          test -f "$src/index.html"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$src/" ./
          touch .nojekyll
          printf '%s\n' 'goedwebwerk.nl' > CNAME
          rm -rf _mirror
      - name: Commit mirrored site
        shell: bash
        run: |
          git config user.name "GOED WEBWERK Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Publish GOED WEBWERK v8 [skip ci]"
            git push
          fi
